#@TYPE: Machine
#@NAME: ZhiHe A210 Development Board
#@SOC: ZhiHe A210
#@DESCRIPTION: Machine configuration for the 8-Core RISC-V ZhiHe A210 SoC

require conf/machine/include/riscv/tune-riscv.inc

DEFAULTTUNE ?= "riscv64"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-mainline"

KERNEL_CLASSES = "kernel"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE ?= "zhihe/a210-dev.dtb"

SERIAL_CONSOLES = "115200;ttyS4"

IMAGE_FSTYPES += "cpio.gz ext4"

MACHINE_FEATURES = "ext2 serial ethernet usbhost"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-modules"
