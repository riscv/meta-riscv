#@TYPE: Machine
#@NAME: licheepi-4a
#@SOC: T-Head 1520
#@DESCRIPTION: Machine configuration for the LicheePi 4A board

require include/th1520.inc

# Extend the list from riscv-common.inc
MACHINE_FEATURES += "wifi bluetooth"

#============================================
# Kernel Configuration
KERNEL_DEVICETREE ?= "thead/th1520-lichee-pi-4a.dtb"
#============================================

#============================================
# Uboot Configuration
UBOOT_MACHINE = "th1520_lpi4a_defconfig"
UBOOT_EXTLINUX_FDT ?= "/th1520-lichee-pi-4a.dtb"
#============================================

#============================================
# Firmware Configuration
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "linux-firmware-powervr linux-firmware-rtl8723"
TH1520_TRAINING_FW_SRC = "lpddr4x-3733-dualrank.lua"
#============================================

#============================================
# Graphics Configuration
DEPENDS:append:pn-mesa = " clang clang-native spirv-llvm-translator spirv-llvm-translator-native"
GALLIUM_DRIVERS:append:pn-mesa = ",zink"
PACKAGECONFIG:append:pn-mesa = " vulkan zink gallium-llvm"
VULKAN_DRIVERS:append:pn-mesa = ",imagination"
#============================================

#============================================
# Image Configuration
WKS_FILE_DEPENDS:append = " firmware-th1520"

IMAGE_BOOT_FILES = " \
    ${KERNEL_IMAGETYPE} \
    th1520-lichee-pi-4a.dtb \
    extlinux.conf;extlinux/extlinux.conf \
    licheepi-4a-aon.elf \
"
#============================================
