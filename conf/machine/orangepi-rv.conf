#@TYPE: Machine
#@NAME: orangepi-rv
#@SOC: StarFive JH7110
#@DESCRIPTION: Machine configuration for the Xunlong Orange Pi RV board

# SoC-only include: the board uses the mainline kernel and U-Boot, not the
# vendor kernel and graphics stack selected by jh7110-common.inc.
require include/jh7110.inc

MACHINE_FEATURES += "efi pci usbhost vfat"

# The mainline defconfig builds board drivers such as the Ethernet MAC
# (DWMAC_STARFIVE) as modules; install them in every image, as
# jh7110-common.inc does for the VisionFive 2.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-modules"

#============================================
# SBI Configuration
# OpenSBI fw_dynamic is packed into U-Boot's FIT image (u-boot.itb) by the
# U-Boot build, so no fw_payload is needed.
RISCV_SBI_FW_TEXT_START = "0x40000000"
unset RISCV_SBI_PAYLOAD
#============================================

#============================================
# Kernel Configuration
PREFERRED_PROVIDER_virtual/kernel ?= "linux-mainline"
KERNEL_DEVICETREE ?= "starfive/jh7110-orangepi-rv.dtb"
KERNEL_IMAGETYPE = "Image"
# The kernel is started as an EFI application, not from a FIT image.
KERNEL_CLASSES = "kernel"
#============================================

#============================================
# U-Boot Configuration
# The board uses the VisionFive 2 U-Boot binaries, see U-Boot
# doc/board/starfive/orangepi_rv.rst. Booting uses U-Boot standard boot
# (bootstd), so no boot script is needed.
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
UBOOT_MACHINE = "starfive_visionfive2_defconfig"
UBOOT_SUFFIX = "itb"
SPL_BINARY = "spl/u-boot-spl.bin.normal.out"
UBOOT_ENV = ""
#============================================

#============================================
# Image Configuration
WKS_FILE ?= "orangepi-rv.wks"
WKS_FILE_DEPENDS:append = " grub-efi"
# U-Boot's EFI boot loads /dtb/${fdtfile} from the EFI System Partition and
# passes it, with its fixups applied, to the EFI application.
IMAGE_EFI_BOOT_FILES ?= "jh7110-orangepi-rv.dtb;dtb/starfive/jh7110-orangepi-rv.dtb"
#============================================
