# Initramfs-only image: there is no rootfs to load modules from, so
# build in the drivers needed for USB and Ethernet

# USB (DWC3 controllers + USB2 PHY + USB3/PCIe combo PHY)
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_GENERIC_PLAT=y
CONFIG_PHY_SPACEMIT_K1_USB2=y
CONFIG_PHY_SPACEMIT_K3_COMBO_PHY=y

# rfkill-gpio nodes for Bluetooth and WLAN on Pico-ITX
CONFIG_RFKILL=y
CONFIG_RFKILL_GPIO=y

# Ethernet
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_SPACEMIT=y

# UFS (rootfs lives on UFS; the riscv defconfig enables neither UFS
# core option, without which SCSI_UFS_SPACEMIT is silently dropped)
CONFIG_SCSI_UFSHCD=y
CONFIG_SCSI_UFSHCD_PLATFORM=y
CONFIG_SCSI_UFS_SPACEMIT=y
