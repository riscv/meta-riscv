on:
  pull_request:
    branches:
      - master
    paths:
      - conf/machine/**
      - kas/**
      - bitbake-registry/**
  workflow_dispatch:

jobs:
  validate-bsp-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate-bsp-coverage.py
