name: Test Zhihe A210 Hardware (OSU-OSL)

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      existing_build_id:
        description: 'Optional: skip BitBake build and boot an existing /var/lib/tftpboot/builds/<build_id>'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
    paths:
      - 'classes/**'
      - 'conf/layer.conf'
      - 'conf/machine/include/**'
      - 'conf/machine/zhihe-a210.conf'
      - 'recipes-bsp/**'
      - 'recipes-kernel/linux/linux-zhihe-a210*'
      - 'kas/base-riscv.yml'
      - 'kas/include/**'
      - 'kas/zhihe-a210.yml'
      - '.github/workflows/test-zhihe-a210.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'classes/**'
      - 'conf/layer.conf'
      - 'conf/machine/include/**'
      - 'conf/machine/zhihe-a210.conf'
      - 'recipes-bsp/**'
      - 'recipes-kernel/linux/linux-zhihe-a210*'
      - 'kas/base-riscv.yml'
      - 'kas/include/**'
      - 'kas/zhihe-a210.yml'
      - '.github/workflows/test-zhihe-a210.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-zhihe-a210:
    name: Build zhihe-a210 (kas / core-image-minimal)
    if: ${{ inputs.existing_build_id == '' }}
    runs-on: ${{ vars.YOCTO_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      meta_riscv_sha: ${{ steps.meta.outputs.meta_riscv_sha }}
      kernel_version: ${{ steps.kas_build.outputs.kernel_version }}
    steps:
      - name: Reclaim Pre-Installed SDK Disk Space if Needed
        run: |
          AVAIL_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Initial free root disk: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 100 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
              /usr/local/share/powershell /usr/local/share/chromium || true
            sudo docker system prune -af --volumes || true
            df -h /
          fi

      - name: Install Host Yocto & kas Dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk gcc git \
            iputils-ping jq libacl1 locales lz4 python3 python3-git \
            python3-jinja2 python3-pexpect python3-pip python3-subunit \
            python3-venv python3-websockets socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
          python3 -m venv "${RUNNER_TEMP}/kas-venv"
          "${RUNNER_TEMP}/kas-venv/bin/pip" install --upgrade pip kas==5.5 websockets
          echo "${RUNNER_TEMP}/kas-venv/bin" >> "$GITHUB_PATH"

      - name: Check out meta-riscv
        uses: actions/checkout@v4
        with:
          path: meta-riscv
          fetch-depth: 1

      - name: Compute Build Metadata
        id: meta
        run: |
          MACHINE="zhihe-a210"
          SHA="$(git -C meta-riscv rev-parse --short=8 HEAD)"
          FULL_SHA="$(git -C meta-riscv rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          BUILD_ID="${DATE}_yocto_${MACHINE}_${SHA}_${GITHUB_RUN_NUMBER}"
          echo "machine=${MACHINE}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "meta_riscv_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build core-image-minimal with kas
        id: kas_build
        env:
          LANG: en_US.UTF-8
          SSTATE_DIR: ${{ vars.YOCTO_SSTATE_DIR || format('{0}/yocto-cache/sstate-cache', runner.temp) }}
          DL_DIR: ${{ vars.YOCTO_DL_DIR || format('{0}/yocto-cache/downloads', runner.temp) }}
        run: |
          set -euo pipefail
          mkdir -p "$SSTATE_DIR" "$DL_DIR" out
          printf '%s\n' \
            'header:' \
            '  version: 20' \
            'target: core-image-minimal' \
            'local_conf_header:' \
            '  ci-cache: |' \
            '    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"' \
            '    IMAGE_FSTYPES = "cpio.gz"' \
            '    DISTRO_FEATURES:remove = "ptest x11 wayland vulkan opengl gobject-introspection-data"' \
            '    PACKAGECONFIG:remove:pn-qemu-system-native = "sdl"' \
            '    PACKAGECONFIG:remove:pn-qemu-native = "sdl"' \
            '    BB_HASHSERVE_UPSTREAM = "wss://hashserv.yoctoproject.org/ws"' \
            '    SSTATE_MIRRORS ?= "file://.* http://cdn.jsdelivr.net/yocto/sstate/all/PATH;downloadfilename=PATH"' \
            '    INHERIT += "rm_work"' \
            > meta-riscv/kas/ci-overrides.yml
          timeout --signal=INT --kill-after=2m 320m \
            kas build "meta-riscv/kas/zhihe-a210.yml:meta-riscv/kas/ci-overrides.yml" --target core-image-minimal

          DEPLOY_DIR="build/tmp/deploy/images/zhihe-a210"
          KERNEL_VERSION="$(basename "$(readlink -f "${DEPLOY_DIR}/Image" || true)" | sed -n 's/^Image--\([0-9][0-9.]*\).*/\1/p')"
          cp -L "${DEPLOY_DIR}/Image" out/Image
          cp -L "${DEPLOY_DIR}/a210-dev.dtb" out/a210-dev.dtb
          cp -L "${DEPLOY_DIR}/core-image-minimal-zhihe-a210.rootfs.cpio.gz" out/rootfs.cpio.gz
          if [ -z "${KERNEL_VERSION}" ]; then
            KERNEL_VERSION="$(strings out/Image | sed -n 's/^Linux version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          fi
          echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"

          OE_CORE_SHA="$(git -C layers/openembedded-core rev-parse HEAD)"
          BITBAKE_SHA="$(git -C layers/bitbake rev-parse HEAD)"
          jq -n \
            --arg build_id "${{ steps.meta.outputs.build_id }}" \
            --arg build_type "yocto" \
            --arg machine "${{ steps.meta.outputs.machine }}" \
            --arg kernel_version "${KERNEL_VERSION}" \
            --arg meta_riscv_sha "${{ steps.meta.outputs.meta_riscv_sha }}" \
            --arg openembedded_core_sha "${OE_CORE_SHA}" \
            --arg bitbake_sha "${BITBAKE_SHA}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              build_id: $build_id,
              build_type: $build_type,
              machine: $machine,
              kernel_version: $kernel_version,
              meta_riscv_sha: $meta_riscv_sha,
              openembedded_core_sha: $openembedded_core_sha,
              bitbake_sha: $bitbake_sha,
              built_at: $built_at
            }' \
            > out/build-info.json
          ls -lh out/
          cat out/build-info.json

      - name: Upload Yocto Boot Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.build_id }}
          path: |
            out/Image
            out/a210-dev.dtb
            out/rootfs.cpio.gz
            out/build-info.json
          retention-days: 14

  test-zhihe-a210:
    name: Netboot & Smoke Test on pool=a210-yocto (OSU-OSL)
    needs: [build-zhihe-a210]
    if: >-
      always() &&
      (needs.build-zhihe-a210.result == 'success' || inputs.existing_build_id != '')
    runs-on: [self-hosted, board-farm-controller]
    timeout-minutes: 25
    env:
      BUILD_ID: ${{ inputs.existing_build_id || needs.build-zhihe-a210.outputs.build_id }}
    steps:
      - name: Download Yocto Boot Bundle
        if: ${{ inputs.existing_build_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ID }}
          path: ${{ runner.temp }}/artifacts-${{ env.BUILD_ID }}

      - name: Stage & Boot Yocto Image on Available Pool Board
        uses: riseproject-dev/board-farm/.github/actions/a210-yocto-netboot-test@main
        with:
          build_id: ${{ env.BUILD_ID }}
          artifact_dir: ${{ runner.temp }}/artifacts-${{ env.BUILD_ID }}
          skip_stage: ${{ inputs.existing_build_id != '' && 'true' || 'false' }}
          pool: "a210-yocto"
          expected_kernel_prefix: ${{ needs.build-zhihe-a210.outputs.kernel_version }}
          update_latest_label: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'true' || 'false' }}
